<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sluneční mise</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#f4f8ff;background:#080f25}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#203766 0%,transparent 48%),#080f25}.shell{max-width:1040px;margin:auto;padding:18px 18px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#b8c9ee;font-weight:700}.progress{height:7px;background:#233658;border-radius:9px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:linear-gradient(90deg,#55c8ff,#f7cc56);transition:width .3s}h1{text-align:center;font-size:clamp(27px,4.5vw,46px);margin:12px 0 10px}h2{font-size:clamp(21px,3vw,31px);margin:8px 0 15px}.lead{text-align:center;color:#d5e4ff;font-size:clamp(17px,2.2vw,22px);margin:0 auto 20px;max-width:760px}.panel{background:#111f3e;border:1px solid #30436b;border-radius:22px;padding:clamp(16px,3vw,30px);box-shadow:0 18px 50px #0003}.center{text-align:center}.scene{position:relative;width:100%;height:clamp(250px,42vw,405px);background:radial-gradient(ellipse at center,#1d345e,#112141);border:2px solid #41577b;border-radius:18px;overflow:hidden;touch-action:none;cursor:default}.scene:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffffa8 1px,transparent 1.6px);background-size:53px 61px;opacity:.38;pointer-events:none}.scene.grid{background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px),radial-gradient(ellipse at center,#1d345e,#112141);background-size:10% 10%,10% 10%,auto}.sun{position:absolute;width:var(--diam,72px);height:var(--diam,72px);left:var(--left,50%);bottom:var(--bottom,50%);transform:translate(-50%,50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff39d,#ffca28 55%,#f59b20);box-shadow:0 0 25px #ffc52a77,0 0 58px #ffb31b35;transition:left .3s,bottom .3s,width .3s,height .3s;z-index:3;pointer-events:none}.sun:after{content:'• ᴗ •';position:absolute;inset:0;display:grid;place-items:center;color:#925012;font-size:clamp(12px,2.3vw,23px);font-weight:900}.ghost{position:absolute;left:var(--left);bottom:var(--bottom);width:var(--diam,80px);height:var(--diam,80px);transform:translate(-50%,50%);border:3px dashed #ffe074;background:#ffe0741c;border-radius:50%;box-shadow:0 0 18px #fbd66d33;pointer-events:none}.axis{position:absolute;left:6%;bottom:9%;height:82%;width:88%;border-left:3px solid #a3bad8;border-bottom:3px solid #a3bad8;pointer-events:none}.origin{position:absolute;bottom:2%;left:7%;font-size:15px;color:#dbe8ff}.sun-coordinates{position:absolute;z-index:8;transform:translateX(-50%);background:#07142eec;border:1px solid #7998c5;border-radius:9px;padding:6px 10px;font-size:20px;font-weight:900;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px #0007}.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin:14px 0}.stack{display:grid;gap:12px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:760px;margin:0 auto}.tile{background:#162a4c;border:1px solid #3e5980;border-radius:17px;padding:18px;text-align:center}.tile strong{display:block;font-size:clamp(17px,2.4vw,24px);margin:12px 0}.demo{height:125px;position:relative;display:flex;align-items:center;justify-content:center}.miniSun{font-size:54px;display:inline-block;filter:drop-shadow(0 0 12px #f9c94280)}.moveX{animation:mx 2.5s ease-in-out infinite alternate}.moveY{animation:my 2.5s ease-in-out infinite alternate}.pulse{animation:sz 2.5s ease-in-out infinite alternate}@keyframes mx{to{transform:translateX(65px)}}@keyframes my{to{transform:translateY(-38px)}}@keyframes sz{to{transform:scale(1.65)}}button{font:inherit;font-weight:750;color:white;border:1px solid #5075a3;background:#244675;padding:12px 18px;border-radius:12px;cursor:pointer;transition:background .15s,transform .15s}button:hover{background:#34649f}button:active{transform:scale(.97)}button.primary{background:#237ed4;border-color:#5ab6ff}button.primary:hover{background:#3195f3}button.gold{background:#93651a;border-color:#f9c849}button.active{outline:3px solid #80d9ff}button:disabled{opacity:.35;cursor:default}.block{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:12px 15px;border-radius:9px 14px 14px 9px;background:#1864ad;border-left:9px solid #0a477d;font-weight:800;min-height:59px;box-shadow:inset 0 -4px #0002}.block.cyan{background:#1294a9;border-left-color:#087186}.block input{width:75px;border:2px solid #e7f2ff;border-radius:6px;padding:8px;font-size:19px;font-weight:800;text-align:center;color:#10203c;background:#fff}.block select{padding:8px;font:inherit;border-radius:7px;border:0;color:#12223d;background:#fff}.blockbutton{cursor:pointer;justify-content:center;min-width:190px}.blockbutton:hover{filter:brightness(1.16)}.hint{background:#22375b;border-radius:12px;padding:13px 17px;text-align:center;font-size:clamp(16px,2vw,20px);font-weight:750;min-height:50px}.success{color:#93f8c3}.sliders{max-width:700px;margin:15px auto;display:grid;gap:15px}.sliderline{display:grid;grid-template-columns:145px 1fr 40px;align-items:center;gap:12px;font-weight:800}.sliderline input{width:100%;accent-color:#6fceff}.sliderline.green input{accent-color:#74e7b5}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.controls button{min-width:58px}.footer{position:fixed;bottom:0;left:0;right:0;background:#081126ed;backdrop-filter:blur(12px);border-top:1px solid #34496b;padding:12px 18px;z-index:20}.footinner{max-width:1040px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.footinner span{font-size:13px;color:#aabfe2}.hide{display:none!important}.pill{padding:8px 15px;border-radius:100px;background:#243d62;font-weight:800}.collectstar{position:absolute;transform:translate(-50%,50%);font-size:35px;filter:drop-shadow(0 0 9px #ffe074);pointer-events:none;z-index:2}.targetstar{position:absolute;font-size:32px;transform:translate(-50%,50%);pointer-events:none}.party{font-size:70px;text-align:center;animation:sz 2s ease-in-out infinite alternate}.names{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}.names span{background:#28436c;border:1px solid #7194c5;padding:12px 20px;border-radius:100px;font-weight:800}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-20px;left:var(--x);width:9px;height:16px;background:var(--c);animation:fall var(--t) linear infinite;animation-delay:var(--d)}@keyframes fall{to{transform:translateY(110vh) rotate(780deg)}}.caption{font-size:14px;color:#b4c9e9;text-align:center}.mini{font-size:14px;color:#b7c8e6}.tag{font-weight:900;color:#8ed7ff;margin:18px 0 7px}.toolbar{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin:8px 0}.toolbar button{padding:9px 13px}.note{color:#c6d8f4;text-align:center} @media(max-width:650px){.cols{grid-template-columns:1fr}.tile{padding:8px}.demo{height:85px}.sliderline{grid-template-columns:100px 1fr 30px}.shell{padding:10px 10px 90px}.panel{padding:13px}.scene{height:280px}.block{font-size:14px}.footinner span{display:none}}@media(prefers-reduced-motion:reduce){.moveX,.moveY,.pulse,.party,.confetti i{animation:none}}

:root{font-family:Arial,sans-serif;color:#19264c;background:#fff9ed}
body{background:#fff9ed;height:100dvh;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.shell{width:min(100%,1400px);max-width:none;height:100%;min-height:0;padding:14px clamp(16px,4vw,54px) 8px;display:grid;grid-template-rows:auto 5px minmax(0,1fr);gap:10px}
header{color:#19264c;font-size:20px}header strong{color:#cf3265}#counter{font-size:15px}
.progress{height:5px;margin:0;background:#e4dfd6}.progress>div{background:#365cdd}
.panel{align-self:center;width:100%;padding:0;border:0;border-radius:0;box-shadow:none;background:transparent}
.game{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:clamp(15px,3vw,42px);align-items:center}
.game h1,.game .lead{text-align:left}.game h1,h1{font-size:clamp(29px,3.3vw,48px);line-height:1.06;margin:4px 0 14px;letter-spacing:-1px}.lead{color:#374568;font-size:clamp(17px,1.6vw,22px);line-height:1.36;margin:0 auto 14px}
.scene,.scene.grid{height:clamp(215px,62dvh,590px);width:100%;border:2px solid #a9b6d6;background:#eef3ff;border-radius:18px}.scene:before{background-image:radial-gradient(#a6b5cf 1px,transparent 2px);opacity:.6}.scene.grid:before{inset:9% 6%;background-image:linear-gradient(#c1cde4 1px,transparent 1px),linear-gradient(90deg,#c1cde4 1px,transparent 1px);background-size:10% 10%;opacity:1}
.axis{border-color:#566988}.origin{color:#19264c}.ghost{border:3px dashed #b44a69;background:#e94f8022}.sun-coordinates{color:white;font-size:16px}.sun{box-shadow:0 0 0 2px #ba7809,0 4px 14px #db9d2338}.collectstar,.targetstar{filter:drop-shadow(0 1px 1px #84590f)}
button{color:#19264c;background:white;border:2px solid #19264c;padding:8px 13px;border-radius:11px}button:hover{background:#e8edff}button.primary,button.gold{background:#365cdd;color:white;border-color:#365cdd}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d63770;outline-offset:2px}
.footer{position:static;background:#fff9ed;border-color:#e1dcd0;padding:8px 4vw}.footinner{max-width:1300px}.footinner span,.mini,.caption{color:#50607b}
.row,.names{margin:8px 0;gap:8px}.sliders{margin:9px 0;gap:8px}.sliderline{grid-template-columns:105px 1fr 32px}.sliderline span:first-child{color:#365cdd!important}.sliderline.green span:first-child{color:#087b65!important}.hint,.pill{background:#e8edff;color:#263965}.success{color:#076953;background:#d8f3e7}.hint{min-height:0;padding:9px}.stack{gap:7px}.tag{margin:5px 0;color:#365cdd!important}.block{background:#365cdd;color:white;min-height:38px;padding:6px 8px;gap:6px}.block.cyan{background:#087b65;color:white}.block input{width:61px;padding:4px}.tile,.names span{background:white;color:#19264c;border:2px solid #c5cfe4}.tile strong{color:#d62f65}.panel .party{font-size:56px}.panel>div[style*='min-height']{min-height:0!important;padding:12px}.scene .sun-coordinates{max-width:100%}.controls{gap:6px}.side>*:last-child{margin-bottom:0}.intro .cols{max-width:800px}.sliderline input{min-width:0}
@media(max-height:700px){.shell{padding-top:8px;gap:6px}.game h1{font-size:30px}.game .lead{font-size:17px}.row,.hint,.stack{margin-block:6px!important}.block{font-size:15px}.scene,.scene.grid{height:62dvh}.side .row button{padding:6px 10px}.tag{font-size:14px}.footer{padding-block:5px}}
.scene,.scene.grid{background-color:#e7ebfa;background-image:radial-gradient(ellipse at 82% 20%,#dcd9f4 0%,transparent 48%),radial-gradient(ellipse at 12% 80%,#cfe7fa 0%,transparent 54%);background-size:cover}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1.5px,transparent 2px),radial-gradient(circle,#fff 1px,transparent 1.7px),radial-gradient(circle,#959dc5 1px,transparent 1.4px);background-size:101px 79px,63px 97px,147px 121px;background-position:18px 29px,27px 8px,53px 13px;opacity:.7}

</style></head><body><main class="shell"><header><span>Sluneční <strong>mise</strong></span><span id="counter"></span></header><div class="progress"><div id="progress"></div></div><section id="content" class="panel"></section></main><nav class="footer"><div class="footinner"><button id="prev">← Předchozí</button><span>Šipky ovládají slunce, mezi snímky přecházej tlačítky.</span><button class="primary" id="next">Další →</button></div></nav><script>
const $=s=>document.querySelector(s);const content=$('#content');let slide=0;const total=10;const S={horizontal:50,vertical:50,hCollected:[],vCollected:[],freeX:50,freeY:50,collected:[],slX:0,slY:0,starMission:0,starX:0,starY:0,locStage:1,locX:0,locY:0,locA:'0',locB:'0',size:60,op:'zvyš',amount:'20',sizeRuns:0,finalX:0,finalY:0,finalSize:60,finalA:'0',finalB:'0',finalOp:'zvyš',finalAmount:'20'};const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));const num=v=>Number.isFinite(+v)?+v:0;const stars=[{x:30,y:20}];const horizontalStars=[20,40,60,80],verticalStars=[20,40,60,80];const collectStars=[{x:20,y:20},{x:80,y:20},{x:20,y:80},{x:80,y:80},{x:50,y:70}];const sliderGoal={x:70,y:60}, positionGoals=[{x:80,y:50},{x:30,y:70}],goalFinal={x:75,y:45,size:100};
let sizeGoal = 105;
const initialState = JSON.stringify(S);
function takeRandom(pool){
 const index = Math.floor(Math.random() * pool.length);
 return pool.splice(index, 1)[0];
}
function changeLineStars(line){
 const positions = [10,20,30,40,60,70,80,90];
 const newPositions = positions.filter(value => !line.includes(value));
 const first = takeRandom(newPositions);
 const remaining = positions.filter(value => value !== first);
 line.splice(0, line.length, first, takeRandom(remaining), takeRandom(remaining), takeRandom(remaining));
}
function startNewRound(){
 const targets = [sliderGoal, stars[0], ...positionGoals, goalFinal, ...collectStars];
 const pool = [];
 for(let x=20; x<=80; x+=10){
  for(let y=20; y<=80; y+=10){
   const used = targets.some(point => point.x===x && point.y===y);
   if(!used && !(x===50 && y===50))pool.push({x,y});
  }
 }
 for(const target of targets)Object.assign(target,takeRandom(pool));
 changeLineStars(horizontalStars);
 changeLineStars(verticalStars);
 const sizes = [75, 90, 105, 120, 135];
 sizeGoal = takeRandom(sizes.filter(size => size !== sizeGoal));
 goalFinal.size = takeRandom(sizes.filter(size => size !== goalFinal.size && size !== sizeGoal));
 Object.assign(S,JSON.parse(initialState));
 go(0);
}
function coordinateLabel(x,y){
 const left = 6 + x * .88;
 const bottom = 9 + y * .82;
 const offset = y >= 70 ? '- 77px' : '+ 42px';
 return `<div class="sun-coordinates" style="left:clamp(48px,${left}%,calc(100% - 48px));bottom:calc(${bottom}% ${offset})"><span style="color:#8ed7ff">${x}</span> | <span style="color:#8cf0ba">${y}</span></div>`;
}
function sun(x,y,size=72){return `<div class="sun" style="--left:${6+x*.88}%;--bottom:${9+y*.82}%;--diam:${size}px"></div>`}function ghost(x,y,size=80){return `<div class="ghost" style="--left:${6+x*.88}%;--bottom:${9+y*.82}%;--diam:${size}px"></div>`}function scene(inner='',grid=false,axis=false,id=''){return `<div class="scene ${grid?'grid':''}" ${id?`id="${id}"`:''}>${axis?'<div class="axis"></div><div class="origin">0 | 0</div>':''}${inner}</div>`}function field(id,value){return `<input id="${id}" type="number" value="${value}" aria-label="Číselná hodnota">`}function positionBlock(id1,id2,a,b){return `<div class="block">jdi vodorovně na: ${field(id1,a)} svisle na: ${field(id2,b)}</div>`}function sizeBlock(prefix,op,amount){return `<div class="block cyan"><select id="${prefix}op"><option value="zvyš" ${op==='zvyš'?'selected':''}>zvyš</option><option value="sniž" ${op==='sniž'?'selected':''}>sniž</option></select> velikost o ${field(prefix+'amount',amount)} %</div>`}function resetBlock(id){return `<button class="block cyan blockbutton" id="${id}">obnov velikost ▶</button>`}function arrowControls(){return `<div class="controls"><button data-dir="left">← Vlevo</button><button data-dir="up">↑ Nahoru</button><button data-dir="down">↓ Dolů</button><button data-dir="right">→ Vpravo</button><button data-dir="reset">↺ Zpět</button></div>`}function slideHtml(){switch(slide){case 0:return `<h1>Sluneční mise</h1><p class="lead">Dnes se naučíme ovládat slunce!</p><div class="cols"><div class="tile"><div class="demo"><span class="miniSun moveX">☀️</span></div><strong>UMÍSTĚNÍ</strong><span class="mini">Kde slunce je?</span></div><div class="tile"><div class="demo"><span class="miniSun pulse">☀️</span></div><strong>VELIKOST</strong><span class="mini">Jak je velké?</span></div></div>`;
case 1:{const done=S.hCollected.length===horizontalStars.length;return `<h1>VODOROVNĚ ↔</h1><p class="lead">Použij šipky ← → a posbírej hvězdičky pohybem <b>VODOROVNĚ</b>.</p><div class="row"><span class="pill">Nasbíráno ⭐ ${S.hCollected.length} / ${horizontalStars.length}</span></div>${scene(horizontalStars.map((x,i)=>S.hCollected.includes(i)?'':`<div class="collectstar" style="left:${6+x*.88}%;bottom:${9+50*.82}%">⭐</div>`).join('')+sun(S.horizontal,50))}${done?'<div class="hint success" style="margin-top:14px">🎉 Skvělé! Všechny vodorovné hvězdy jsou posbírané!</div>':''}<div class="row"><button data-dir="left">← Vlevo</button><button data-dir="right">Vpravo →</button><button data-dir="center">⊕ Jdi na střed</button><button data-dir="replay">↺ Hrát znovu</button></div>`;}
case 2:{const done=S.vCollected.length===verticalStars.length;return `<h1>SVISLE ↕</h1><p class="lead">Použij šipky ↑ ↓ a posbírej hvězdičky pohybem <b>SVISLE</b>.</p><div class="row"><span class="pill">Nasbíráno ⭐ ${S.vCollected.length} / ${verticalStars.length}</span></div>${scene(verticalStars.map((y,i)=>S.vCollected.includes(i)?'':`<div class="collectstar" style="left:${6+50*.88}%;bottom:${9+y*.82}%">⭐</div>`).join('')+sun(50,S.vertical))}${done?'<div class="hint success" style="margin-top:14px">🎉 Skvělé! Všechny svislé hvězdy jsou posbírané!</div>':''}<div class="row"><button data-dir="up">↑ Nahoru</button><button data-dir="down">↓ Dolů</button><button data-dir="center">⊕ Jdi na střed</button><button data-dir="replay">↺ Hrát znovu</button></div>`;}
case 3:{const complete=S.collected.length===collectStars.length;return `<h1>POSBÍREJ VŠECHNY HVĚZDY ⭐</h1><p class="lead">Použij všechny čtyři šipky na klávesnici. Doleť sluncem ke každé hvězdě!</p><div class="row"><span class="pill">Nasbíráno ⭐ ${S.collected.length} / ${collectStars.length}</span></div>${scene(collectStars.map((p,i)=>S.collected.includes(i)?'':`<div class="collectstar" style="left:${6+p.x*.88}%;bottom:${9+p.y*.82}%">⭐</div>`).join('')+sun(S.freeX,S.freeY))}${complete?'<div class="hint success" style="margin-top:14px">🎉 Výborně! Všechny hvězdy jsou tvoje!</div>':''}${arrowControls().replace('↺ Zpět','↺ Začít znovu')}`}
case 4:{const {x:gx,y:gy}=sliderGoal,won=S.slX===gx&&S.slY===gy;return `<h1>UMÍSTI SLUNCE DO STÍNU ☀️</h1><p class="lead">Umísti slunce <b>vodorovnými a svislými pohyby</b> do vyznačeného stínu. Sleduj, jak se mění souřadnice. Začínáme vlevo dole na <b>0 | 0</b>.</p>${scene(ghost(gx,gy,76)+sun(S.slX,S.slY)+coordinateLabel(S.slX,S.slY),true,true)}<div class="sliders"><div class="sliderline"><span style="color:#8ed7ff">Vodorovně ↔</span><input id="slX" aria-label="Nastavení souřadnice" type="range" min="0" max="100" step="10" value="${S.slX}"><span>${S.slX}</span></div><div class="sliderline green"><span style="color:#8cf0ba">Svisle ↕</span><input id="slY" aria-label="Nastavení souřadnice" type="range" min="0" max="100" step="10" value="${S.slY}"><span>${S.slY}</span></div></div>${sliderArrows()}${won?`<div class="hint success">🌟 Výborně! Slunce je na správném místě!</div>`:`<div class="hint">Použij šipky nebo táhla a tref se do stínu!</div>`}`;}
case 5:{let t=stars[S.starMission],won=S.starX===t.x&&S.starY===t.y;return `<h1>DOLEŤ KE HVĚZDĚ ⭐</h1><p class="lead">Nastav polohu slunce podle čísel: <b>${t.x} | ${t.y}</b></p>${scene(`<div class="targetstar" style="left:${6+t.x*.88}%;bottom:${9+t.y*.82}%">⭐</div>`+sun(S.starX,S.starY)+coordinateLabel(S.starX,S.starY),true,true)}<div class="sliders"><div class="sliderline"><span style="color:#8ed7ff">Vodorovně ↔</span><input id="starX" aria-label="Nastavení souřadnice" type="range" min="0" max="100" step="10" value="${S.starX}"><span>${S.starX}</span></div><div class="sliderline green"><span style="color:#8cf0ba">Svisle ↕</span><input id="starY" aria-label="Nastavení souřadnice" type="range" min="0" max="100" step="10" value="${S.starY}"><span>${S.starY}</span></div></div>${sliderArrows()}${won?`<div class="hint success">Výborně! ⭐ Úkol splněn! 🌟</div>`:''}`}
case 6:{const goalLoc=positionGoals[S.locStage-1];let won=S.locX===goalLoc.x&&S.locY===goalLoc.y;let outside=S.locX<0||S.locX>100||S.locY<0||S.locY>100;return `<div class="row"><span class="pill">ÚKOL ${S.locStage} / 2</span></div><h1>DOSTAŇ SLUNCE DO STÍNU</h1><p class="lead">${S.locStage===1?'Nastav vodorovnou a svislou polohu dvěma příkazy.':'Dostaň slunce do nového stínu jedním společným příkazem.'}</p>${scene(ghost(goalLoc.x,goalLoc.y,78)+sun(S.locX,S.locY),true,true)}<div class="stack" style="margin-top:16px">${S.locStage===2?positionBlock('locA','locB',S.locA,S.locB):`<div class="block">nastav vodorovnou pozici na: ${field('locA',S.locA)}</div><div class="block">nastav svislou pozici na: ${field('locB',S.locB)}</div>`}<button class="primary" id="locRun">▶ Spustit program</button></div>${outside?'<div class="hint" style="margin-top:14px">🚀 Slunce odletělo mimo scénu! Zadej jiné souřadnice a spusť příkaz znovu.</div>':''}${won?`<div class="hint success" style="margin-top:14px">Výborně! Slunce je na správném místě. ${S.locStage===1?'<button id="locNext">Pokračovat na ÚKOL 2 →</button>':'Oba způsoby zvládnuté! 🌟'}</div>`:''}`}
case 7:{let diff=S.size-sizeGoal,success=Math.abs(diff)<=2;let feedback=success?'PERFEKTNÍ! SLUNCE ZAPADLO DO STÍNU! ⭐':S.sizeRuns===0?'Dokážeš slunce dostat do stínu?':diff<0?['Ještě málo! ZVYŠ velikost.','Pořád málo! Zkus příkaz spustit znovu.','Slunce je stále malé. ZVYŠ velikost.'][(S.sizeRuns-1)%3]:['Slunce je moc velké! SNIŽ velikost.','Pořád příliš velké! Zkus SNIŽ.','Přerostlo stín. SNIŽ velikost.'][(S.sizeRuns-1)%3];return `<h1>TREF SPRÁVNOU VELIKOST!</h1><p class="lead"><b>Spouštěj příkaz opakovaně!</b> Sleduj, jak se slunce pokaždé změní.</p>${scene(`<div class="ghost" style="left:50%;bottom:50%;width:${sizeGoal}px;height:${sizeGoal}px"></div><div class="sun" style="left:50%;bottom:50%;width:${S.size}px;height:${S.size}px"></div>`)}<div class="hint ${success?'success':''}" style="margin:14px 0">${feedback}</div><div class="stack">${sizeBlock('size',S.op,S.amount)}<button class="primary" id="sizeRun">▶ Spustit příkaz znovu</button>${resetBlock('sizeReset')}</div><p class="caption">Spuštění příkazu: ${S.sizeRuns}× · Aktuální velikost: ${S.size} %</p>`}
case 8:{let outside=S.finalX<0||S.finalX>100||S.finalY<0||S.finalY>100;let place=Math.abs(S.finalX-goalFinal.x)<=5&&Math.abs(S.finalY-goalFinal.y)<=5,sz=Math.abs(S.finalSize-goalFinal.size)<=3;return `<h1>☀️ SLUNEČNÍ VÝZVA</h1><p class="lead">Dostaň slunce do stínu a uprav jeho velikost!</p>${scene(ghost(goalFinal.x,goalFinal.y,goalFinal.size)+sun(S.finalX,S.finalY,S.finalSize),true,true)}<div class="hint ${place&&sz?'success':''}" style="margin:14px 0">${place&&sz?'Mise splněna! 🌟':outside?'🚀 Slunce je mimo scénu! Zadej jiné souřadnice a spusť umístění znovu.':!place?'Najdi správné místo a dostaň slunce do stínu!':S.finalSize<goalFinal.size?'Ještě malé! ZVYŠ velikost.':'Příliš velké! SNIŽ velikost.'}</div><div class="tag">UMÍSTĚNÍ</div>${positionBlock('finalA','finalB',S.finalA,S.finalB)}<div class="row"><button class="primary" id="finalMove">▶ Spustit umístění</button></div><div class="tag" style="color:#8cf0ba">VELIKOST</div>${sizeBlock('final',S.finalOp,S.finalAmount)}<div class="row"><button class="primary" id="finalSizeRun">▶ Spustit změnu velikosti</button>${resetBlock('finalReset')}</div>${place&&sz?'<div class="row"><button class="gold" id="celebrate">🎉 Oslavit vítězství →</button></div>':''}`}
case 9:return `<div style="position:relative;overflow:hidden;min-height:440px"><div class="confetti">${Array.from({length:45},(_,i)=>`<i style="--x:${(i*37)%100}%;--c:${['#ffd15d','#69d8ff','#ff7ca4','#91f3b5','#bda0ff'][i%5]};--t:${3+i%4}s;--d:-${(i*7)%9}s"></i>`).join('')}</div><h1>🎉 MISE SPLNĚNA! 🎉</h1><div class="party">☀️🏆⭐</div><h2 class="center">JSTE SLUNEČNÍ PROGRAMÁTOŘI!</h2><p class="lead">Dokázali jste slunce <b>pohybovat</b>, <b>umístit</b> i <b>změnit jeho velikost</b>!</p><p class="lead">Skvělá práce, posádko!</p><div class="row"><button class="gold" id="restart">↺ Zahrát znovu</button></div></div>`;}}
function fitPage(){
 content.style.zoom='1';
 const height=content.parentElement.getBoundingClientRect().bottom-parseFloat(getComputedStyle(content.parentElement).paddingBottom)-document.querySelector('.progress').getBoundingClientRect().bottom-parseFloat(getComputedStyle(content.parentElement).rowGap);
 if(content.offsetHeight>height)content.style.zoom=String(Math.min(1,(height-3)/content.offsetHeight));
}
function arrange(){
 const sceneBox=content.querySelector('.scene');
 if(!sceneBox)return;
 const side=document.createElement('div');
 side.className='side';
 for(const child of [...content.children])if(child!==sceneBox)side.append(child);
 const layout=document.createElement('div');
 layout.className='game';
 layout.append(sceneBox,side);
 content.replaceChildren(layout);
}
function canAdvance(){
 if(slide===0 || slide===total-1)return true;
 if(slide===6 && S.locStage===1)return false;
 return Boolean(content.querySelector('.hint.success'));
}
function updateNavigation(){
 const next = document.querySelector('#next');
 next.disabled = !canAdvance();
 next.title = next.disabled ? 'Nejdřív dokonči tento úkol.' : '';
}
function render(){content.innerHTML=slideHtml();arrange();fitPage();$('#counter').textContent=`${slide+1} / ${total}`;$('#progress').style.width=`${(slide+1)/total*100}%`;$('#prev').disabled=slide===0;$('#next').textContent=slide===total-1?'Na začátek ↺':'Další →';updateNavigation();bind()}
function updateSlider(key,value){
 S[key]=Number(value);
 document.getElementById(key).value=value;
 const template=document.createElement('div');
 template.innerHTML=slideHtml();
 content.querySelector('.scene').innerHTML=template.querySelector('.scene').innerHTML;
 document.getElementById(key).nextElementSibling.textContent=value;
 const previous=content.querySelector('.hint');
 const updated=template.querySelector('.hint');
 if(previous)previous.remove();
 if(updated)content.querySelector('.side').append(updated);
 updateNavigation();
 fitPage();
}
const sliderDirections = {
 ArrowLeft: ['X', -10], ArrowRight: ['X', 10],
 ArrowDown: ['Y', -10], ArrowUp: ['Y', 10]
};
function sliderArrows(){
 return `<div class="controls" aria-label="Pohyb slunce"><button data-step="ArrowLeft" aria-label="Vlevo">←</button><button data-step="ArrowUp" aria-label="Nahoru">↑</button><button data-step="ArrowDown" aria-label="Dolů">↓</button><button data-step="ArrowRight" aria-label="Vpravo">→</button></div>`;
}
function stepSlider(direction){
 const [axis, step] = sliderDirections[direction];
 const key = (slide === 5 ? 'star' : 'sl') + axis;
 updateSlider(key, clamp(S[key] + step, 0, 100));
}
document.addEventListener('keydown', event => {
 if((slide !== 4 && slide !== 5) || !Object.hasOwn(sliderDirections, event.key)) return;
 event.preventDefault();
 stepSlider(event.key);
});
content.addEventListener('click', event => {
 const button = event.target.closest('[data-step]');
 if((slide === 4 || slide === 5) && button) stepSlider(button.dataset.step);
});
window.addEventListener('resize',fitPage);
function bind(){const click=(id,fn)=>{let el=$('#'+id);if(el)el.addEventListener('click',fn)};const input=(id,fn,event='input')=>{let el=$('#'+id);if(el)el.addEventListener(event,e=>fn(e.target.value))};document.querySelectorAll('[data-dir]').forEach(el=>el.onclick=()=>move(el.dataset.dir));if(slide===4){input('slX',v=>updateSlider('slX',v));input('slY',v=>updateSlider('slY',v))}if(slide===5){input('starX',v=>updateSlider('starX',v));input('starY',v=>updateSlider('starY',v));click('starNext',()=>{S.starMission++;S.starX=0;S.starY=0;render()})}if(slide===6){input('locA',v=>S.locA=v);input('locB',v=>S.locB=v);click('locRun',()=>{S.locX=num(S.locA);S.locY=num(S.locB);render()});click('locNext',()=>{S.locStage=2;S.locX=0;S.locY=0;S.locA='0';S.locB='0';render()})}if(slide===7){input('sizeop',v=>S.op=v,'change');input('sizeamount',v=>S.amount=v);click('sizeRun',()=>{S.size=clamp(Math.round(S.size*(1+(S.op==='zvyš'?1:-1)*clamp(num(S.amount),0,200)/100)),10,180);S.sizeRuns++;render()});click('sizeReset',()=>{S.size=60;S.sizeRuns=0;render()})}if(slide===8){input('finalA',v=>S.finalA=v);input('finalB',v=>S.finalB=v);input('finalop',v=>S.finalOp=v,'change');input('finalamount',v=>S.finalAmount=v);click('finalMove',()=>{S.finalX=num(S.finalA);S.finalY=num(S.finalB);render()});click('finalSizeRun',()=>{S.finalSize=clamp(Math.round(S.finalSize*(1+(S.finalOp==='zvyš'?1:-1)*clamp(num(S.finalAmount),0,200)/100)),10,180);render()});click('finalReset',()=>{S.finalSize=60;render()});click('celebrate',()=>go(9))}if(slide===9)click('restart',startNewRound)}
function move(dir){if(dir==='replay'&&(slide===1||slide===2)){if(slide===1){S.horizontal=50;S.hCollected=[]}else{S.vertical=50;S.vCollected=[]}render();return}let k=slide===1?'horizontal':slide===2?'vertical':null;if(dir==='center'){if(slide===1)S.horizontal=50;if(slide===2)S.vertical=50;render();return}if(dir==='reset'){if(slide===1)S.horizontal=50;if(slide===2)S.vertical=50;if(slide===3){S.freeX=50;S.freeY=50;S.collected=[]}}else if(slide===1&&['left','right'].includes(dir)){S.horizontal=clamp(S.horizontal+(dir==='left'?-10:10),0,100)}else if(slide===2&&['up','down'].includes(dir)){S.vertical=clamp(S.vertical+(dir==='up'?10:-10),0,100)}else if(slide===3){if(dir==='left')S.freeX=clamp(S.freeX-10,0,100);if(dir==='right')S.freeX=clamp(S.freeX+10,0,100);if(dir==='up')S.freeY=clamp(S.freeY+10,0,100);if(dir==='down')S.freeY=clamp(S.freeY-10,0,100);collectStars.forEach((p,i)=>{if(!S.collected.includes(i)&&Math.abs(S.freeX-p.x)<=5&&Math.abs(S.freeY-p.y)<=5)S.collected.push(i)})}if(slide===1)horizontalStars.forEach((x,i)=>{if(S.horizontal===x&&!S.hCollected.includes(i))S.hCollected.push(i)});if(slide===2)verticalStars.forEach((y,i)=>{if(S.vertical===y&&!S.vCollected.includes(i))S.vCollected.push(i)});render()}
function go(n){if(n>slide && (n!==slide+1 || !canAdvance()))return;slide=clamp(n,0,total-1);render();window.scrollTo({top:0,behavior:'smooth'})}$('#prev').onclick=()=>go(slide-1);$('#next').onclick=()=>slide===total-1?startNewRound():go(slide+1);document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;const dirs={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(dirs[e.key]&&slide>=1&&slide<=3){e.preventDefault();move(dirs[e.key])}});render();
</script></body></html>
